<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fractal Flames</title>
<style>
  :root { --fg:#e9e6f2; --dim:#8a869c; --line:#26232f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:grid; place-items:center; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #ui { position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
    display:flex; gap:8px; align-items:center; padding:8px 10px; border-radius:999px;
    background:rgba(10,9,14,.72); backdrop-filter:blur(10px); border:1px solid var(--line);
    transition:opacity .4s; }
  #ui.hide { opacity:0; pointer-events:none; }
  button { font:inherit; color:var(--fg); background:#17151e; border:1px solid var(--line);
    padding:7px 14px; border-radius:999px; cursor:pointer; }
  button:hover { background:#221f2d; }
  button kbd { color:var(--dim); font:inherit; font-size:12px; margin-left:6px; }
  #info { color:var(--dim); font-size:12px; padding:0 8px; min-width:120px; text-align:center;
    font-variant-numeric:tabular-nums; }
  #bar { position:fixed; left:0; top:0; height:2px; width:0; background:#fff; opacity:.55; }
  #hint { position:fixed; top:14px; left:50%; transform:translateX(-50%); color:var(--dim);
    font-size:12px; transition:opacity 1s; pointer-events:none; }
  @media (max-width:520px){ button kbd{display:none;} #info{display:none;} }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="bar"></div>
<div id="hint">Clique, Espaço = nova &middot; P = paleta &middot; S = salvar PNG</div>
<div id="ui">
  <button id="bNova">Nova<kbd>Espaço</kbd></button>
  <button id="bPal">Paleta<kbd>P</kbd></button>
  <button id="bSave">Salvar<kbd>S</kbd></button>
  <span id="info"></span>
</div>

<script>
"use strict";
// resolução = tamanho real da janela (com limite de ~3,2 milhões de pixels para manter fluido)
let W = 0, H = 0, N = 0, target = 0;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const off = document.createElement('canvas');
const octx = off.getContext('2d');
const b1 = document.createElement('canvas'), b2 = document.createElement('canvas');   // brilho barato (versões pequenas)
const b1x = b1.getContext('2d'), b2x = b2.getContext('2d');
let img, px32, cnt, csum;

function setupSize(){
  let w = innerWidth, h = innerHeight;
  const k = Math.min(1, Math.sqrt(1.4e6 / (w*h)));
  W = Math.max(64, Math.round(w*k)); H = Math.max(64, Math.round(h*k)); N = W*H;
  canvas.width = off.width = W; canvas.height = off.height = H;
  b1.width = Math.max(8, W >> 2); b1.height = Math.max(8, H >> 2);
  b2.width = Math.max(8, W >> 4); b2.height = Math.max(8, H >> 4);
  img = octx.createImageData(W, H);
  px32 = new Uint32Array(img.data.buffer);
  cnt = new Float32Array(N);    // quantos pontos caíram no pixel
  csum = new Float32Array(N);   // soma do índice de cor
  target = N * 120;
}
setupSize();

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- paleta (cosseno de Inigo Quilez) ---------- */
const pal = new Uint8Array(256 * 3);
function makePalette(rand){
  const a = [0.45+rand()*0.2, 0.4+rand()*0.2, 0.45+rand()*0.2];
  const b = [0.45+rand()*0.35, 0.4+rand()*0.35, 0.45+rand()*0.35];
  const c = [0.6+rand()*1.4, 0.6+rand()*1.4, 0.6+rand()*1.4];
  const d = [rand(), rand(), rand()];
  for (let i=0;i<256;i++){
    const t = i/255;
    for (let k=0;k<3;k++){
      const v = a[k] + b[k]*Math.cos(6.28318*(c[k]*t + d[k]));
      pal[i*3+k] = Math.max(0, Math.min(255, v*255)) | 0;
    }
  }
}

/* ---------- flame ---------- */
const NV = 15;
const VAR_WEIGHT = [0.4,1.2,1,1,1,0.7,1,0.8,0.8,1,0.7,1,0.9,0.8,0.8]; // chance de cada variação
let nT = 0, sym = 1;
let A = new Float64Array(6*6), cum = new Float64Array(6), ccol = new Float64Array(6), cspd = new Float64Array(6);
let vCount = new Int32Array(6), vType = new Int32Array(6*3), vW = new Float64Array(6*3);
let cx = 0, cy = 0, scale = 1;
let symCos = [1], symSin = [0];
let total = 0;

function pickVar(rand){
  let s = 0; for (let i=0;i<NV;i++) s += VAR_WEIGHT[i];
  let r = rand()*s;
  for (let i=0;i<NV;i++){ r -= VAR_WEIGHT[i]; if (r<=0) return i; }
  return 1;
}

function buildFlame(rand){
  nT = 2 + (rand()*3 | 0);                 // 2..4 transformações
  const r = rand();
  sym = r<0.3 ? 1 : r<0.45 ? 2 : r<0.6 ? 3 : r<0.75 ? 4 : r<0.88 ? 5 : 6;
  symCos = []; symSin = [];
  for (let s=0;s<sym;s++){ symCos.push(Math.cos(6.283185*s/sym)); symSin.push(Math.sin(6.283185*s/sym)); }
  let wsum = 0; const w = [];
  for (let t=0;t<nT;t++){
    const s1 = 0.3+rand()*0.6, s2 = 0.3+rand()*0.6;
    const t1 = rand()*6.2832, t2 = t1 + (rand()-0.5)*2.2;
    const a = s1*Math.cos(t1), c = s1*Math.sin(t1);
    const b = -s2*Math.sin(t2), d = s2*Math.cos(t2);
    A[t*6]=a; A[t*6+1]=b; A[t*6+2]=(rand()-0.5)*3; A[t*6+3]=c; A[t*6+4]=d; A[t*6+5]=(rand()-0.5)*3;
    const det = Math.abs(a*d - b*c);
    w.push((0.4 + rand()) * (det + 0.15)); wsum += w[t];
    const vc = 1 + (rand()*3 | 0); vCount[t] = vc;
    let vs = 0;
    for (let k=0;k<vc;k++){ vType[t*3+k] = pickVar(rand); vW[t*3+k] = 0.3 + rand(); vs += vW[t*3+k]; }
    for (let k=0;k<vc;k++) vW[t*3+k] /= vs;
    ccol[t] = (t + rand()*0.6) / nT;
    cspd[t] = 0.25 + rand()*0.5;
  }
  let acc = 0;
  for (let t=0;t<nT;t++){ acc += w[t]/wsum; cum[t] = acc; }
  cum[nT-1] = 1;
}

/* núcleo do chaos game; mode 0 = amostrar (guarda xs/ys), mode 1 = desenhar */
let sx = 0, sy = 0, sc = 0.5;
function iterate(n, draw, outX, outY){
  let x = sx, y = sy, col = sc, k = 0;
  const halfW = W/2, halfH = H/2;
  for (let i=-24; i<n; i++){
    const rr = Math.random();
    let t = 0; while (t < nT-1 && rr > cum[t]) t++;
    const o = t*6;
    const ax = A[o]*x + A[o+1]*y + A[o+2];
    const ay = A[o+3]*x + A[o+4]*y + A[o+5];
    const r2 = ax*ax + ay*ay, r = Math.sqrt(r2) + 1e-9, th = Math.atan2(ax, ay);
    let nx = 0, ny = 0;
    const vc = vCount[t];
    for (let v=0; v<vc; v++){
      const w = vW[t*3+v];
      switch (vType[t*3+v]){
        case 0: nx += w*ax; ny += w*ay; break;
        case 1: nx += w*Math.sin(ax); ny += w*Math.sin(ay); break;
        case 2: { const q = 1/(r2+1e-9); nx += w*ax*q; ny += w*ay*q; break; }
        case 3: { const s = Math.sin(r2), c = Math.cos(r2); nx += w*(ax*s - ay*c); ny += w*(ax*c + ay*s); break; }
        case 4: nx += w*(ax-ay)*(ax+ay)/r; ny += w*2*ax*ay/r; break;
        case 5: nx += w*th/Math.PI; ny += w*(r-1); break;
        case 6: nx += w*r*Math.sin(th+r); ny += w*r*Math.cos(th-r); break;
        case 7: nx += w*r*Math.sin(th*r); ny -= w*r*Math.cos(th*r); break;
        case 8: { const q = th/Math.PI; nx += w*q*Math.sin(Math.PI*r); ny += w*q*Math.cos(Math.PI*r); break; }
        case 9: nx += w*(Math.cos(th)+Math.sin(r))/r; ny += w*(Math.sin(th)-Math.cos(r))/r; break;
        case 10: nx += w*Math.sin(th)/r; ny += w*r*Math.cos(th); break;
        case 11: nx += w*Math.sin(th)*Math.cos(r); ny += w*Math.cos(th)*Math.sin(r); break;
        case 12: { const p0 = Math.sin(th+r), p1 = Math.cos(th-r); const a3 = p0*p0*p0, b3 = p1*p1*p1; nx += w*r*(a3+b3); ny += w*r*(a3-b3); break; }
        case 13: { const q = 2/(r+1); nx += w*q*ay; ny += w*q*ax; break; }
        case 14: { const q = Math.sqrt(r), om = (Math.random()<0.5?0:Math.PI) + th*0.5; nx += w*q*Math.cos(om); ny += w*q*Math.sin(om); break; }
      }
    }
    x = nx; y = ny;
    col += (ccol[t] - col) * cspd[t];
    if (!(x*x + y*y < 1e12)) { x = Math.random()*2-1; y = Math.random()*2-1; col = Math.random(); continue; }
    if (i < 0) continue;
    if (draw){
      const ci = col;
      for (let s=0; s<sym; s++){
        const dx = x - cx, dy = y - cy;
        const rx = sym>1 ? dx*symCos[s] - dy*symSin[s] : dx;
        const ry = sym>1 ? dx*symSin[s] + dy*symCos[s] : dy;
        const X = (rx*scale + halfW) | 0, Y = (ry*scale + halfH) | 0;
        if (X>=0 && X<W && Y>=0 && Y<H){ const p = Y*W + X; cnt[p] += 1; csum[p] += ci; }
      }
    } else { outX[k] = x; outY[k] = y; k++; }
  }
  sx = x; sy = y; sc = col;
  return k;
}

/* tenta ajustar câmera e verifica se o fractal é "bonito" (preenche área razoável) */
function fitCamera(){
  const M = 6000;
  const xs = new Float64Array(M), ys = new Float64Array(M);
  sx = Math.random()*2-1; sy = Math.random()*2-1; sc = 0.5;
  const k = iterate(M, false, xs, ys);
  if (k < M*0.9) return 0;
  let rx, ry;
  if (sym > 1){
    const rs = new Float64Array(M);
    for (let i=0;i<M;i++) rs[i] = Math.hypot(xs[i], ys[i]);
    rs.sort();
    const r99 = rs[(M*0.985)|0];
    if (!(r99 > 1e-2 && r99 < 1e3)) return 0;
    cx = 0; cy = 0; scale = (Math.min(W,H)/2) / (r99*1.08);
  } else {
    const a = Float64Array.from(xs).sort(), b = Float64Array.from(ys).sort();
    const x0 = a[(M*0.01)|0], x1 = a[(M*0.99)|0], y0 = b[(M*0.01)|0], y1 = b[(M*0.99)|0];
    const range = Math.max(x1-x0, y1-y0);
    if (!(range > 1e-2 && range < 1e3)) return 0;
    cx = (x0+x1)/2; cy = (y0+y1)/2; scale = Math.min(W,H) / (range*1.12);
  }
  // cobertura numa grade 40x40
  const G = 40, grid = new Uint8Array(G*G); let filled = 0;
  for (let i=0;i<M;i++){
    for (let s=0;s<sym;s++){
      const dx = xs[i]-cx, dy = ys[i]-cy;
      const rx = sym>1 ? dx*symCos[s] - dy*symSin[s] : dx;
      const ry = sym>1 ? dx*symSin[s] + dy*symCos[s] : dy;
      const X = ((rx*scale + W/2)/W*G) | 0, Y = ((ry*scale + H/2)/H*G) | 0;
      if (X>=0&&X<G&&Y>=0&&Y<G && !grid[Y*G+X]) { grid[Y*G+X] = 1; filled++; }
    }
  }
  return filled / (G*G);
}

/* ---------- estado & renderização ---------- */
let seed = 1, palIdx = 0;
function palRand(){ return mulberry32(seed*7919 + palIdx*104729 + 17); }

function newFlame(s){
  seed = s;
  const rand = mulberry32(seed);
  let attempts = 0, cov = 0;
  do {
    buildFlame(rand); cov = fitCamera(); attempts++;
  } while ((cov < 0.16 || cov > 0.8) && attempts < 400);
  cnt.fill(0); csum.fill(0); total = 0;
  makePalette(palRand());
  sx = Math.random()*2-1; sy = Math.random()*2-1; sc = 0.5;
  history.replaceState(null, '', '#' + seed + '.' + palIdx);
  lastRender = 0; running = true;
  document.getElementById('bar').style.opacity = .55;
}

let lastRender = 0;
function render(){
  // referência de brilho: percentil alto da densidade
  const smp = [];
  for (let i=0;i<N;i+=53) if (cnt[i] > 0) smp.push(cnt[i]);
  if (!smp.length) return;
  const sorted = Float32Array.from(smp).sort();
  const ref = sorted[Math.min(sorted.length-1, (sorted.length*0.992)|0)];
  const inv = 1 / Math.log(1 + ref);
  const L = Math.min(200000, Math.ceil(ref) + 1);           // tabela de brilho por contagem inteira (evita log/pow por pixel)
  const lut = new Float32Array(L + 1);
  for (let k=0;k<=L;k++){ let a = Math.log(1 + k) * inv; if (a > 1) a = 1; lut[k] = Math.pow(a, 0.85); }
  for (let i=0;i<N;i++){
    const n = cnt[i];
    if (n === 0) { px32[i] = 0xFF000000; continue; }
    const a = n >= L ? 1 : lut[n | 0];
    let ci = ((csum[i]/n) * 255) | 0; if (ci < 0) ci = 0; else if (ci > 255) ci = 255;
    const r = pal[ci*3]   * a, g = pal[ci*3+1] * a, b = pal[ci*3+2] * a;
    px32[i] = 0xFF000000 | (b << 16) | (g << 8) | r;
  }
  octx.putImageData(img, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(off, 0, 0);
  // brilho (bloom)
  ctx.globalCompositeOperation = 'lighter';
  b1x.imageSmoothingQuality = b2x.imageSmoothingQuality = ctx.imageSmoothingQuality = 'high';
  b1x.drawImage(off, 0, 0, b1.width, b1.height);              // reduz, depois amplia suavizado = brilho sem blur caro
  b2x.drawImage(b1, 0, 0, b2.width, b2.height);
  ctx.globalAlpha = 0.5;  ctx.drawImage(b1, 0, 0, W, H);
  ctx.globalAlpha = 0.55; ctx.drawImage(b2, 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

let running = true;
const info = document.getElementById('info'), bar = document.getElementById('bar');
function frame(now){
  if (running){
    const t0 = performance.now();
    while (performance.now() - t0 < 9 && total < target){ iterate(10000, true); total += 10000; }
    if (now - lastRender > (total < 20e6 ? 250 : 700) || total >= target){ render(); lastRender = now; }
    if (total >= target){ running = false; render(); bar.style.opacity = 0; }
    bar.style.width = Math.min(100, total/target*100) + '%';
    info.textContent = 'semente ' + seed + ' · ' + (total/1e6).toFixed(0) + 'M pts';
  }
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
function nova(){ palIdx = 0; newFlame((Math.random()*1e6 + 1) | 0); }
function paleta(){ palIdx++; makePalette(palRand()); history.replaceState(null,'','#'+seed+'.'+palIdx); render(); }
function salvar(){
  canvas.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = 'flame-' + seed + '.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000); });
}
document.getElementById('bNova').onclick = nova;
document.getElementById('bPal').onclick = paleta;
document.getElementById('bSave').onclick = salvar;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); nova(); }
  else if (e.key === 'p' || e.key === 'P') paleta();
  else if (e.key === 's' || e.key === 'S') salvar();
});
canvas.addEventListener('click', nova);
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { setupSize(); newFlame(seed); }, 300); });

// some a UI quando o mouse para
const ui = document.getElementById('ui'), hint = document.getElementById('hint');
let hideT; function wake(){ ui.classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(()=>ui.classList.add('hide'), 3500); }
addEventListener('mousemove', wake); addEventListener('touchstart', wake); wake();
setTimeout(()=>hint.style.opacity = 0, 5000);

// iniciar (hash: #semente.paleta)
const m = location.hash.match(/#(\d+)\.(\d+)/);
if (m) { palIdx = +m[2]; newFlame(+m[1]); } else nova();
requestAnimationFrame(frame);
</script>
</body>
</html>
